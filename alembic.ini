# Alembic configuration — Telegram AI Assistant.
# NOTE: keep this file ASCII-only (Windows cp1251 consoles break on UTF-8 comments).

[alembic]
# Path to migration scripts (relative to repo root).
script_location = app/db/migrations

# Migration file names: 0001_initial.py, 0002_xxx.py, ...
file_template = %%(rev)s_%%(slug)s

# Import `app.*` when running from repo root.
prepend_sys_path = .

# Timezone for create_date in the migration template.
timezone = UTC

# URL is intentionally NOT hardcoded: env.py reads DATABASE_URL env var first,
# then app.config.get_settings().database_url. Manual override:
# sqlalchemy.url = postgresql+asyncpg://user:pass@host:5432/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
