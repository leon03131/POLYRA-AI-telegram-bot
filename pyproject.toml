[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibot"
version = "0.1.0"
description = "Telegram AI assistant (aiogram 3 + FastAPI + PostgreSQL + Gemini/Alibaba)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7,<2.14",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42",
    "openai>=1.40",
    "google-genai>=2.24,<3.0.0",
    "tzdata>=2024.1",  # IANA tz для zoneinfo (app.llm.gemini.quota PACIFIC) на Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "ASYNC", "B", "SIM", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*", "migrations.*"]
ignore_errors = true

# Тесты: фейки/namespace-стабы осознанно не соответствуют продакшн-типам —
# для них ослабляем конкретные проверки, остальное остаётся strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disable_error_code = ["arg-type", "type-arg", "attr-defined"]
