# CI: python gates (ruff/mypy/pytest) + miniapp build.
# Весь набор offline: тесты не требуют сети, живой БД и реальных API-ключей
# (tests/integration — контрактные, на in-memory фейках и httpx.MockTransport).
# Live-проверки провайдеров сюда НЕ входят (scripts/smoke_providers.py — вручную).

name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements-файла нет; манифест зависимостей — pyproject.toml.
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy app tests scripts

      - name: pytest
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install (reproducible, по lockfile)
        run: npm ci

      - name: Build (tsc strict + vite build)
        run: npm run build
